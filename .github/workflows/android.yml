name: Build RouteGlass APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RouteGlass-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: unzip -q RouteGlass-source.zip

      - run: gradle -p RouteGlass assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RouteGlass-APK
          path: RouteGlass/app/build/outputs/apk/debug/app-debug.apk
